name: eng-zh-subtitle-burner

services:
  ollama:
    image: ollama/ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  # ollama is deliberately NOT a depends_on: every API run would then have to
  # keep an 8.4GB image around for a service it never talks to. run.sh starts
  # ollama itself when --translate-via local is asked for.
  worker:
    build: .
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${HOST_DIR:-.}:/data
      - hf_cache:/root/.cache/huggingface
    profiles:
      - run

volumes:
  ollama_data:
  hf_cache:
