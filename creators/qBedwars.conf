# qBedwars — Minecraft / Hypixel Bed Wars.
# Read by run.sh. Anything omitted falls back to the built-in default.

context   = youtuber plays minecraft hypixel bedwars, casual gaming commentary
sub_mode  = zh
zh_margin = 58

# --- bilibili ---
# tid 17 = 单机游戏, where Minecraft content sits. See docs/bilibili-tid.md.
tid       = 17
tags      = 起床战争,Minecraft,我的世界,Hypixel,游戏,外挂,玩家,整活
# 1 = 自制 (contracted, authorised). 2 = 转载, which also needs a source URL.
copyright = 1
cookie    = bilibili/qBedwars.json

# Description. {source} becomes the original YouTube URL, {creator} the
# author name below, {title} the original English title. \n is a newline.
author    = qBedwars
desc      = 原视频作者:{creator} (@qBedwars)\n原视频:{source}\n\n已获原作者授权翻译搬运 字幕为本人制作\n喜欢的话请三连支持 也欢迎去原频道支持作者

# Publish hour in China time. 18:00 is the peak publish slot on Bilibili --
# see docs/bilibili-tid.md notes. schedule=0 posts immediately instead.
publish_hour = 18
schedule     = 1
